{% extends "base.html" %} {% block content %}
<div class="container" style="max-width: 500px; margin: 4rem auto;">
    <div class="problem-submit">
        <h1>Khởi tạo Node mới (Đăng ký)</h1>
        
        <form action="/register/" method="POST">
            {% csrf_token %}
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Nomad Username:</label>
                <input type="text" name="username" 
                    style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--gray-medium); background: var(--bg); color: var(--text); box-sizing: border-box;" 
                    placeholder="Tên truy cập hệ thống..." required>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Email Address:</label>
                <input type="email" name="email" 
                    style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--gray-medium); background: var(--bg); color: var(--text); box-sizing: border-box;" 
                    placeholder="Email để nhận Log..." required>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Security Key (Password):</label>
                <input type="password" name="password" 
                    style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--gray-medium); background: var(--bg); color: var(--text); box-sizing: border-box;" 
                    placeholder="Mã bảo mật..." required>
            </div>

            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Ngôn ngữ sở trường:</label>
                <select name="fav_lang" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--gray-medium); background: var(--bg); color: var(--text);">
                    <option value="cpp">C++ (Hệ chiến)</option>
                    <option value="py">Python (Hệ gánh team)</option>
                    <option value="asm">Assembly (Hệ vặc mạch)</option>
                </select>
            </div>

            <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">
                INITIALIZE ACCOUNT & JOIN DSMOJ
            </button>
        </form>

        <div style="margin-top: 20px; text-align: center; font-size: 0.85rem; color: #888;">
            Đã có Node trên hệ thống? <a href="/login/" style="color: var(--primary);">Đăng nhập ngay</a>
        </div>
    </div>
</div>
{% endblock %}
